<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebootworthy Touch Dashboard</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <header class="topbar">
    <div>
      <h1 id="brandName">REBOOTWORTHY</h1>
      <p id="brandSubtitle">Touch Dashboard</p>
    </div>

    <div class="clock">
      <span id="time">--:--</span>
      <span id="date">Loading...</span>
    </div>
  </header>

  <main class="dashboard">
    <section class="hero">
      <h2 id="heroHeadline">Old Tech. New Purpose.</h2>
      <p id="heroDescription">
        A lightweight dashboard built for repurposed touchscreen devices.
      </p>
    </section>

    <section class="tiles" id="tiles"></section>
  </main>

  <footer>
    <span>Rebootworthy Touch Dashboard v0.2</span>
    <button id="fullscreenBtn">Fullscreen</button>
  </footer>

  <script src="static/js/config.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
