<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebootworthy Touch Dashboard</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <header class="topbar">
    <div>
      <h1>REBOOTWORTHY</h1>
      <p>Touch Dashboard</p>
    </div>

    <div class="clock">
      <span id="time">--:--</span>
      <span id="date">Loading...</span>
    </div>
  </header>

  <main class="dashboard">

    <section class="hero">
      <h2>Old Tech. New Purpose.</h2>
      <p>A lightweight dashboard built for repurposed touchscreen devices.</p>
    </section>

    <section class="tiles">

      <button class="tile">
        <span class="icon">🖥️</span>
        <span class="title">Homelab</span>
        <span class="subtitle">Servers & services</span>
      </button>

      <button class="tile">
        <span class="icon">🏋️</span>
        <span class="title">Workout</span>
        <span class="subtitle">Training dashboard</span>
      </button>

      <button class="tile">
        <span class="icon">🌐</span>
        <span class="title">Network</span>
        <span class="subtitle">Network status</span>
      </button>

      <button class="tile">
        <span class="icon">📊</span>
        <span class="title">Monitoring</span>
        <span class="subtitle">System health</span>
      </button>

      <button class="tile">
        <span class="icon">🎵</span>
        <span class="title">Media</span>
        <span class="subtitle">Music & entertainment</span>
      </button>

      <button class="tile">
        <span class="icon">⚙️</span>
        <span class="title">Controls</span>
        <span class="subtitle">Quick actions</span>
      </button>

    </section>

  </main>

  <footer>
    <span>Rebootworthy Touch Dashboard v0.1</span>
    <button id="fullscreenBtn">Fullscreen</button>
  </footer>

  <script src="static/js/app.js"></script>
</body>
</html>
